<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <title th:text="${titlu}">Platformă Teorie Java</title>
    <style>
        body { /* body se aplica pe toata pagina */
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px; /* adauga margini interioare de 20px pe laturile paginii */
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container { /* . arată că stilul se aplică tuturor elementelor HTML care au atributul class="container" */
            max-width: 800px;
            margin: 0 auto;
        }
        .card, .form-container { /* Stilul pentru .card și .form-container */
            background: white;
            border-radius: 8px; /* rotunjeste colturile */
            padding: 20px;
            margin-bottom: 20px; /* Lasă spațiu de 20px sub fiecare card ca să nu se lipească între ele. */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-container h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn { /* stilul pt butoane */
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .badge { /* stilizeaza titlurile/categoriile din fiecare lectie cu albastru */
            background-color: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            text-transform: uppercase;
            display: inline-block;
        }
        .titlu-lectie {
            margin-top: 10px;
            color: #2c3e50;
        }
        .continut {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<!-- SECȚIUNE DE PROFIL / AUTOR -->
<div class="profile-header" style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; gap: 20px;">

    <!-- Poza de profil -->
    <div style="display: flex; align-items: center; gap: 15px;">
        <img src="/poza.jpg" alt="Poza Profil" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #3498db;">
        <div>
            <h2 style="margin: 0; color: #2c3e50;">Perdei Alexandru</h2>
            <p style="margin: 3px 0 0 0; color: #7f8c8d; font-size: 0.9em;">Student Facultatea de Automatică și Calculatoare | Java Developer</p>
        </div>
    </div>

    <!-- Datele de contact -->
    <div style="font-size: 0.9em; color: #555; text-align: right;">
        <p style="margin: 3px 0;">📧 <strong>Email:</strong> perdeialexandru0@gmail.com</p>
        <p style="margin: 3px 0;">📞 <strong>Telefon:</strong> 0755830202</p>
        <p style="margin: 3px 0;">💻 <strong>GitHub:</strong> github.com/username</p>
    </div>

</div>

<div class="container">
    <h1 th:text="${titlu}">Titlu Implicit</h1>

    <!-- BARA DE CĂUTARE -->
    <div class="form-container" style="background: #eef2f7; padding: 15px;">
        <form action="/" method="GET" style="display: flex; gap: 10px;"> <!-- form creaza un formular -->
            <input type="text" name="cautare" th:value="${cautare}" placeholder="Caută după titlu sau categorie (ex: OOP)..." style="flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">

            <!-- MENIUL DROP-DOWN NOU (Adăugat între input și butonul Caută) -->
            <select name="categorie" onchange="this.form.submit()" style="padding: 10px; border-radius: 4px; border: 1px solid #ccc; background-color: white; cursor: pointer;">
                <option value="Toate" th:selected="${categorieSelectata == null || categorieSelectata == 'Toate'}">
                    -- Toate Categoriile --
                </option>
                <option th:each="cat : ${categorii}"
                        th:value="${cat}"
                        th:text="${cat}"
                        th:selected="${cat == categorieSelectata}">
                </option>
            </select>
            <button type="submit" class="btn" style="background-color: #3498db;">Caută</button>
            <a href="/" class="btn" style="background-color: #95a5a6; text-decoration: none; text-align: center; line-height: 20px;">Resetează</a>
        </form>
    </div>

    <!-- FORMULARUL PENTRU ADĂUGARE LECȚIE -->
    <div class="form-container">
        <h2>Adaugă o lecție nouă</h2>
        <form th:action="@{/salveaza}" method="POST">
            <div class="form-group">
                <label for="titlu">Titlu Lecție:</label>
                <input type="text" id="titlu" name="titlu" required placeholder="ex: Interfețe în Java">
            </div>
            <div class="form-group">
                <label for="categorie">Categorie:</label>
                <input type="text" id="categorie" name="categorie" required placeholder="ex: OOP">
            </div>
            <div class="form-group">
                <label for="continut">Conținut:</label>
                <textarea id="continut" name="continut" rows="4" required placeholder="Scrie teoria aici..."></textarea>
            </div>
            <div class="form-group">
                <label for="cod">Cod:</label>
                <textarea id="cod" name="cod" rows="4" required placeholder="Scrie codul aici..."></textarea>
            </div>
            <div class="form-group">
                <label for="explicatie">Explicație:</label>
                <textarea id="explicatie" name="explicatie" rows="4" required placeholder="Scrie explicația aici..."></textarea>
            </div>
            <button type="submit" class="btn">Adaugă Lecție</button>
        </form>
    </div>

    <!-- LISTA DE LECȚII DIN BAZA DE DATE -->
    <div class="card" th:each="lectie : ${lectii}">
        <span class="badge" th:text="${lectie.categorie}">Categorie</span>
        <a th:href="@{/lectie/{id}(id=${lectie.id})}" style="text-decoration: none;">
            <h2 class="titlu-lectie" th:text="${lectie.titlu}" style="cursor: pointer;">Titlu Lecție</h2>
        </a>
        <p class="continut" th:text="${lectie.continut}">Conținutul lecției...</p>

        <!-- CONTAINER BUTOANE DE ACȚIUNE ALINIATE ORIZONTAL -->
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <a th:href="@{/editeaza(id=${lectie.id})}" class="btn" style="background-color: #f39c12; text-decoration: none; line-height: 20px;">Editează</a>

            <!-- FORMULAR ȘTERGERE -->
            <form th:action="@{/sterge}" method="POST" style="margin: 0;">
                <input type="hidden" name="id" th:value="${lectie.id}" />
                <button type="submit" class="btn" style="background-color: #e74c3c;">Șterge</button>
            </form>
        </div> <!-- Închide containerul de butoane -->

    </div> <!-- Închide cardul lecției -->

</div> <!-- Închide containerul principal -->

</body>
</html>
