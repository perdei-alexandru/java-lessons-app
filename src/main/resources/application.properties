# Denumirea aplicatiei

spring.application.name=site-teorie

# Configurare Baza de Date H2 (in memorie)
spring.datasource.url=jdbc:h2:file:./data/teoriedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permite vizualizarea consolei H2 in browser la /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# JPA / Hibernate - creeaza si actualizeaza automat tabelele pe baza claselor Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true